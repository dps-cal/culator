name: Deploy calculator v0.2

on:
  push:
    paths:
      - '.deploy/delta.b64'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct latest calculator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, pickle, random

          payload = base64.b64decode(Path('.deploy/delta.b64').read_bytes())
          obj = pickle.loads(gzip.decompress(payload))
          ops = obj['ops']
          literal = obj['literal']
          target = obj['target']

          random.seed(1)
          gear = [random.getrandbits(64) for _ in range(256)]

          def chunks(data, min_size=512, avg=2048, max_size=8192):
              mask = avg - 1
              out = []
              start = 0
              h = 0
              for i, b in enumerate(data):
                  h = ((h << 1) + gear[b]) & ((1 << 64) - 1)
                  size = i - start + 1
                  if size >= min_size and ((h & mask) == 0 or size >= max_size):
                      c = data[start:i+1]
                      out.append((hashlib.sha256(c).hexdigest()[:24], c))
                      start = i + 1
                      h = 0
              if start < len(data):
                  c = data[start:]
                  out.append((hashlib.sha256(c).hexdigest()[:24], c))
              return out

          base = Path('index.html').read_bytes()
          lookup = {h: c for h, c in chunks(base)}
          pos = 0
          parts = []
          missing = []
          for kind, value in ops:
              if kind == 'r':
                  c = lookup.get(value)
                  if c is None:
                      missing.append(value)
                  else:
                      parts.append(c)
              else:
                  n = value
                  parts.append(literal[pos:pos+n])
                  pos += n

          if missing:
              raise SystemExit(f'Missing stable chunks: {len(missing)} / {missing[:8]}')

          output = b''.join(parts)
          sha = hashlib.sha256(output).hexdigest()
          if sha != target:
              raise SystemExit(f'Checksum mismatch: {sha} != {target}')

          Path('index.html').write_bytes(output)
          Path('index (23).html').write_bytes(output)
          print('Reconstructed', len(output), 'bytes', sha)
          PY
      - name: Commit deployed site
        shell: bash
        run: |
          rm -f .deploy/delta.b64
          rm -f .github/workflows/deploy-v02.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy calculator v0.2"
          git push
